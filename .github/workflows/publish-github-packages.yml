name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@abenteur3r'
          package-manager-cache: false
      - name: Prepare GitHub package metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error('Release tag must match the version in package.json');
          }
          pkg.name = '@abenteur3r/task-solver-suite';
          pkg.publishConfig = { ...pkg.publishConfig, registry: 'https://npm.pkg.github.com' };
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Publish package
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
